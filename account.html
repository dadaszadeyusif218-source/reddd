<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой аккаунт</title>

    <link rel="stylesheet" href="script.css">
    <link rel="stylesheet" href="account.css">
</head>
<body class="account-page" data-protected>

    <main class="account">
        <a class="account-logo" href="index.html">LOGO</a>

        <h1>Мой аккаунт</h1>
        <p class="account-subtitle">Информация о вашем профиле</p>

        <nav class="account-nav" aria-label="Навигация">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="login.html">Войти</a>
            <a href="register.html">Регистрация</a>
        </nav>

        <div id="loader" class="loader"
             role="status"
             aria-label="Загрузка профиля"></div>

        <section id="content" class="profile-info hidden">
            <p><b>Имя:</b> <span id="name">—</span></p>
            <p><b>Фамилия:</b> <span id="surname">—</span></p>
            <p><b>Email:</b> <span id="email">—</span></p>
            <p><b>Имя пользователя:</b> <span id="username">—</span></p>
        </section>

        <section id="error" class="error hidden">
            <p id="error-text">Не удалось загрузить профиль.</p>
            <button id="retry" class="retry-button" type="button">
                Повторить
            </button>
        </section>

        <button id="logout" class="logout" type="button">
            Выйти из аккаунта
        </button>
    </main>

    <script src="account.js" defer></script>
</body>
</html>
