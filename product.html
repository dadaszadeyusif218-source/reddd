
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6fa">
  <title>Товар — LOGO STORE</title>
  <link rel="stylesheet" href="script.css">
</head>
<body>
  <header class="header">
    <div class="container header_inner">
      <a href="index.html" class="logo">LOGO STORE</a>

      <nav class="nav">
        <a href="index.html" class="nav_link">Главная</a>
        <a href="catalog.html" class="nav_link active">Каталог</a>
        <a href="login.html" class="nav_link">Войти</a>
        <a href="register.html" class="nav_link">Регистрация</a>
        
      </nav>

      <div class="header_action">
        <a href="cart" class="cart-link">Корзина</a>
      </div>
    </div>
  </header>

  <main class="container product-page">
    <nav class="breadcrumbs" aria-label="Навигация">
      <a href="index.html">Главная</a>
      <span>/</span>
      <a href="catalog.html">Каталог</a>
      <span>/</span>
      <span id="breadcrumbProduct">Товар</span>
    </nav>

    <section class="product" id="product" aria-live="polite">
      <p class="loading-state">Загружаем информацию о товаре…</p>
    </section>

    <section class="product-reviews">
      <h2>Отзывы покупателей</h2>
      <div id="reviews">
        Отзывы для этого товара пока не добавлены.
      </div>
    </section>

    <div style="margin-top:24px">
      <a href="catalog.html" class="btn-secondary">
        ← Вернуться в каталог
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © <span id="year"></span> LOGO STORE
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>
  <script src="product.js"></script>
</body>
</html>
