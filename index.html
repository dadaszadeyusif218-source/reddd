<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="script.css">
    <link rel="stylesheet" href="navbar.css">
</head>

<body>

<header class="site-header" id="siteHeader"></header>

<main>

    <section class="hero">
        <div class="container">
            <a href="#catalog" class="btn">Смотреть товары</a>
            <br>
        </div>
    </section>

    <section class="section" id="catalog">
        <h1>Самые популярные товары</h1>

        <div class="container">
      <input type="text" placeholder="search products" id="search" oninput="searchProducts()">
      <button class="chip" onclick="sortByPrice()">Сортировка</button>
      <button onclick="loadProducts()">Сбросить фильтр</button>
            <div class="products" id="products">
            </div>
        </div>
    </section>

</main>

<footer class="footer" id="login">
    <div class="container">
        <p>© 2026. Все права защищены.</p>
    </div>
</footer>

<script src="script.js"></script>
<script src="navbar.js"></script>
<script src="cart.js"></script>

</body>
</html>
